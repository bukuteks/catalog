<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Detail - Channel Buku Teks</title>
  <meta name="description" content="Download this textbook via Telegram, PDF, or Google Drive.">
  <link rel="icon" href="../cdn/images/book-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="navbar-container"></div>

  <section class="book-detail" id="book-content">
    <div class="container">
      <div class="breadcrumb" id="breadcrumb">
        <div class="skeleton" style="width:300px;height:20px"></div>
      </div>

      <div class="book-detail-layout">
        <div class="book-detail-cover" id="book-cover">
          <div class="skeleton" style="width:100%;height:100%;border-radius:var(--radius-lg)"></div>
        </div>
        <div class="book-detail-info">
          <h1 id="book-title"><span class="skeleton" style="display:inline-block;width:300px;height:36px"></span></h1>
          <p class="book-detail-subject" id="book-subject"><span class="skeleton" style="display:inline-block;width:200px;height:20px"></span></p>

          <div class="book-meta-grid" id="book-meta">
            <div class="skeleton" style="height:70px"></div>
            <div class="skeleton" style="height:70px"></div>
            <div class="skeleton" style="height:70px"></div>
            <div class="skeleton" style="height:70px"></div>
          </div>

          <div class="download-section">
            <h2>Download</h2>
            <div class="download-buttons" id="download-buttons">
              <div class="skeleton" style="height:56px;border-radius:var(--radius-md)"></div>
              <div class="skeleton" style="height:56px;border-radius:var(--radius-md)"></div>
              <div class="skeleton" style="height:56px;border-radius:var(--radius-md)"></div>
            </div>
          </div>

          <div class="related-section" id="related-section" style="display:none">
            <h2>Related Books</h2>
            <div class="book-grid" id="related-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>

  <script src="assets/js/search.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = Components.navbar('');
    document.getElementById('footer-container').innerHTML = Components.footer();
    App.initBookDetail();
  </script>
</body>
</html>
